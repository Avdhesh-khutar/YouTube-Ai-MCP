name: Cinematic video review package

on:
  workflow_dispatch:
    inputs:
      seconds_per_scene:
        description: "Seconds per scene (2-12)"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate cinematic assets
        run: |
          test -d assets/cinematic-scenes || {
            echo "Missing assets/cinematic-scenes. Add scene-01.png, scene-02.png, etc."
            exit 1
          }
          find assets/cinematic-scenes -maxdepth 1 -type f -name 'scene-*' | grep -E '\\.(png|jpg|jpeg|webp)
            echo "No scene images found. Add at least two AI-generated scene images."
            exit 1
          }
      - name: Render cinematic video
        run: |
          python scripts/generate_cinematic_video.py \\
            --seconds-per-scene "${{ inputs.seconds_per_scene }}"
      - name: Verify output
        run: |
          test -s dist-cinematic/cinematic-video.mp4
          test -s dist-cinematic/thumbnail.jpg
          test -s dist-cinematic/render-report.json
          ffprobe -v error -show_entries stream=codec_type,width,height -of json dist-cinematic/cinematic-video.mp4
      - name: Save private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-video-review-${{ github.run_id }}
          path: dist-cinematic/
          retention-days: 7
 | grep -q . || {
            echo "No scene images found. Add at least two AI-generated scene images."
            exit 1
          }
      - name: Render cinematic video
        run: |
          python scripts/generate_cinematic_video.py \\
            --seconds-per-scene "${{ inputs.seconds_per_scene }}"
      - name: Verify output
        run: |
          test -s dist-cinematic/cinematic-video.mp4
          test -s dist-cinematic/thumbnail.jpg
          test -s dist-cinematic/render-report.json
          ffprobe -v error -show_entries stream=codec_type,width,height -of json dist-cinematic/cinematic-video.mp4
      - name: Save private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-video-review-${{ github.run_id }}
          path: dist-cinematic/
          retention-days: 7
