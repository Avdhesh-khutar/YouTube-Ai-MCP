name: Hugging Face free GPU motion preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-space-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gradio client
        run: python -m pip install --disable-pip-version-check gradio_client

      - name: Inspect Space API only (no generation)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from gradio_client import Client

          space = "techfreakworm/LTX2.3-Studio"
          token = os.environ.get("HF_TOKEN") or None
          client = Client(space, token=token)
          api = client.view_api(return_format="dict")
          Path("hf-space-api-preflight.json").write_text(
              __import__("json").dumps(api, indent=2, default=str),
              encoding="utf-8",
          )
          print("API metadata inspection completed. No predict/submit call was made.")
          PY

      - name: Upload API metadata for review
        uses: actions/upload-artifact@v4
        with:
          name: hf-space-api-preflight
          path: hf-space-api-preflight.json
          retention-days: 3
