name: Cinematic workflow scaffold checks

on:
  pull_request:
    paths:
      - "scripts/orchestrate_cinematic_workflow.py"
      - "scripts/prepare_offline_narration.py"
      - "scripts/plan_cinematic_scenes.py"
      - "scripts/check_cinematic_quality.py"
      - "scripts/check_comfyui_endpoint.py"
      - "scripts/cinematic_provider_contract.py"
      - "scripts/validate_scene_plan.py"
      - "tests/**"
      - "config/cinematic-workflow.example.json"
      - ".github/workflows/cinematic-orchestrator-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile workflow scripts
        run: python -m py_compile scripts/prepare_offline_narration.py scripts/orchestrate_cinematic_workflow.py scripts/plan_cinematic_scenes.py scripts/check_cinematic_quality.py scripts/check_comfyui_endpoint.py scripts/cinematic_provider_contract.py scripts/validate_scene_plan.py
      - name: Validate configuration and private-only policy
        run: python scripts/orchestrate_cinematic_workflow.py --topic "प्राचीन भारत के रहस्य" --jobs-dir /tmp/cinematic-jobs
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
