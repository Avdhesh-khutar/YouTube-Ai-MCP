name: Cinematic pipeline code checks

on:
  pull_request:
    paths:
      - "scripts/**"
      - "CINEMATIC_PIPELINE.md"
      - ".github/workflows/cinematic-*.yml"
  push:
    branches:
      - "feature/cinematic-video-pipeline"
    paths:
      - "scripts/**"
      - "CINEMATIC_PIPELINE.md"
      - ".github/workflows/cinematic-*.yml"

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies needed for CLI checks
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Compile pipeline scripts
        run: python -m py_compile scripts/generate_cinematic_video.py scripts/plan_cinematic_scenes.py scripts/comfyui_generate_assets.py scripts/generate_daily_video.py
      - name: Check CLI help
        run: |
          python scripts/generate_cinematic_video.py --help
          python scripts/plan_cinematic_scenes.py --help
          python scripts/comfyui_generate_assets.py --help
          python scripts/generate_daily_video.py --help
      - name: Check custom topic length validation
        run: |
          topic="$(python -c 'print("x" * 101)')"
          if python scripts/generate_daily_video.py --topic "$topic" >topic-check.log 2>&1; then
            echo "Expected an overlong custom topic to be rejected."
            exit 1
          fi
          grep -q -- "--topic must be 100 characters or fewer" topic-check.log
