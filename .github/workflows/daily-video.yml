name: Daily video package

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free offline rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          pip install Pillow
      - name: Render daily video package
        run: python scripts/generate_daily_video.py
      - name: Upload private-review package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-private-review-${{ github.run_id }}
          path: dist/
          retention-days: 7
