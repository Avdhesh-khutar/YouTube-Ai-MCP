name: Daily video package

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_daily_video.py"
      - ".github/workflows/daily-video.yml"
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free offline rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core
          python -m pip install --upgrade pip
          pip install Pillow
          pip install edge-tts || echo 'Edge TTS install unavailable; renderer will use offline Hindi speech'
      - name: Render daily video package
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # Keep paid API calls disabled until the chosen voice is API-eligible.
          ELEVENLABS_USE_API: "false"
        run: python scripts/generate_daily_video.py
      - name: Verify rendered video and required deliverables
        run: |
          set -euo pipefail
          test -s dist/daily-youtube-video.mp4
          test -s dist/thumbnail.jpg
          test -s dist/script.txt
          test -s dist/captions.srt
          test -s dist/metadata.json
          test -s dist/scene-contact-sheet.jpg
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 dist/daily-youtube-video.mp4)
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=s=x:p=0 dist/daily-youtube-video.mp4)
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=s=x:p=0 dist/daily-youtube-video.mp4)
          echo "Video duration: ${duration}s; resolution: ${width}x${height}"
          python -c "import sys; assert float(sys.argv[1]) >= 60, 'Video is unexpectedly short'" "$duration"
          test "$width" = "1280"
          test "$height" = "720"
          # Validate thumbnail dimensions and required metadata/captions.
          python -c 'from PIL import Image; im=Image.open("dist/thumbnail.jpg"); assert im.size == (1280, 720), f"Unexpected thumbnail size: {im.size}"'
          python -c 'import json; from pathlib import Path; m=json.loads(Path("dist/metadata.json").read_text(encoding="utf-8")); assert m.get("title", "").strip(), "Missing title"; assert m.get("description", "").strip(), "Missing description"; assert isinstance(m.get("tags"), list) and m["tags"], "Missing tags"; s=Path("dist/captions.srt").read_text(encoding="utf-8"); assert s.count("-->") >= 8, "Captions missing/incomplete"; assert len(Path("dist/script.txt").read_text(encoding="utf-8").strip()) >= 500, "Script too short"; print("Metadata, captions, script and thumbnail checks passed.")'
          # Confirm the rendered file has an audio stream and SRT cues are valid and ordered.
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-select_streams", "a:0",
               "-show_entries", "stream=codec_type", "-of", "csv=p=0",
               "dist/daily-youtube-video.mp4"],
              check=True, capture_output=True, text=True,
          )
          assert "audio" in probe.stdout, "Rendered video has no audio stream"
          srt = Path("dist/captions.srt").read_text(encoding="utf-8").strip()
          blocks = re.split(r"\n\\s*\n", srt)
          previous_end = 0
          def to_ms(stamp):
              h, m, rest = stamp.split(":")
              sec, ms = rest.split(",")
              return ((int(h)*60 + int(m))*60 + int(sec))*1000 + int(ms)
          for block in blocks:
              lines = block.splitlines()
              assert len(lines) >= 3, f"Malformed SRT block: {block[:80]}"
              assert lines[0].strip().isdigit(), "SRT cue index is not numeric"
              match = re.fullmatch(r"(\d{2}:\d{2}:\d{2},\d{3}) --> (\d{2}:\d{2}:\d{2},\d{3})", lines[1].strip())
              assert match, f"Malformed SRT timestamp: {lines[1]}"
              start, end = map(to_ms, match.groups())
              assert start < end, "SRT cue has zero/negative duration"
              assert start >= previous_end, "SRT cues overlap or are out of order"
              assert any(line.strip() for line in lines[2:]), "Empty caption cue"
              previous_end = end
          print(f"Audio stream present; {len(blocks)} ordered, non-empty SRT cues validated.")
          PY
      - name: Upload private-review package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-private-review-${{ github.run_id }}
          path: dist/
          retention-days: 7
      - name: Upload as PRIVATE to connected YouTube channel
        env:
          UPLOAD_TOKEN: ${{ secrets.YOUTUBE_PRIVATE_UPLOAD_TOKEN }}
        # Temporarily prevent repeated uploads of the draft while visual/audio quality is being improved.
        if: false
        run: |
          set -euo pipefail
          size=$(stat -c%s dist/daily-youtube-video.mp4)
          if [ "$size" -gt $((47 * 1024 * 1024)) ]; then
            echo "Video exceeds the 47 MB safe upload limit; artifact retained for review."
            exit 1
          fi
          title=$(jq -r .title dist/metadata.json)
          description=$(jq -r .description dist/metadata.json)
          tags=$(jq -r '.tags | join(",")' dist/metadata.json)
          curl --fail-with-body --silent --show-error \
            -X POST "https://youtube-ai-mcp.mkkhutar2.workers.dev/automation/upload" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -F "video=@dist/daily-youtube-video.mp4;type=video/mp4" \
            -F "thumbnail=@dist/thumbnail.jpg;type=image/jpeg" \
            -F "title=$title" \
            -F "description=$description" \
            -F "tags=$tags"
