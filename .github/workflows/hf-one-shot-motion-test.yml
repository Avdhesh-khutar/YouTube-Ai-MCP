name: Hugging Face one-shot AI motion test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-api-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gradio client
        run: python -m pip install --disable-pip-version-check gradio_client

      - name: Inspect Gradio endpoint schema (no GPU generation)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from gradio_client import Client

          space = "techfreakworm/LTX2.3-Studio"
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN secret is missing. No request was sent.")

          client = Client(space, token=token)
          api = client.view_api(all_endpoints=True, print_info=False, return_format="dict")
          endpoints = api.get("named_endpoints", {})
          endpoint = endpoints.get("/handler_1")
          if endpoint is None:
              raise SystemExit(
                  "No named /handler_1 endpoint was found. Available named endpoints: "
                  + ", ".join(sorted(endpoints))
                  + ". No GPU request was sent."
              )

          parameters = endpoint.get("parameters", [])
          print("Discovered /handler_1 parameter schema:")
          print(json.dumps(parameters, indent=2, ensure_ascii=False))
          print(f"Parameter count reported by Gradio: {len(parameters)}")
          print("Schema inspection completed. This workflow intentionally sends NO generation request.")
          PY
