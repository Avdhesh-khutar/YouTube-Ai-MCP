name: Daily video package

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_daily_video.py"
      - ".github/workflows/daily-video.yml"
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free offline rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core
          python -m pip install --upgrade pip
          pip install Pillow
      - name: Render daily video package
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # Keep paid API calls disabled until the chosen voice is API-eligible.
          ELEVENLABS_USE_API: "false"
        run: python scripts/generate_daily_video.py
      - name: Verify rendered video and required deliverables
        run: |
          set -euo pipefail
          test -s dist/daily-youtube-video.mp4
          test -s dist/thumbnail.jpg
          test -s dist/script.txt
          test -s dist/captions.srt
          test -s dist/metadata.json
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 dist/daily-youtube-video.mp4)
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=s=x:p=0 dist/daily-youtube-video.mp4)
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=s=x:p=0 dist/daily-youtube-video.mp4)
          echo "Video duration: ${duration}s; resolution: ${width}x${height}"
          python -c "import sys; assert float(sys.argv[1]) >= 60, 'Video is unexpectedly short'" "$duration"
          test "$width" = "1280"
          test "$height" = "720"
      - name: Upload private-review package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-private-review-${{ github.run_id }}
          path: dist/
          retention-days: 7
      - name: Upload as PRIVATE to connected YouTube channel
        env:
          UPLOAD_TOKEN: ${{ secrets.YOUTUBE_PRIVATE_UPLOAD_TOKEN }}
        if: env.UPLOAD_TOKEN != ''
        run: |
          set -euo pipefail
          size=$(stat -c%s dist/daily-youtube-video.mp4)
          if [ "$size" -gt $((47 * 1024 * 1024)) ]; then
            echo "Video exceeds the 47 MB safe upload limit; artifact retained for review."
            exit 1
          fi
          title=$(jq -r .title dist/metadata.json)
          description=$(jq -r .description dist/metadata.json)
          tags=$(jq -r '.tags | join(",")' dist/metadata.json)
          curl --fail-with-body --silent --show-error \
            -X POST "https://youtube-ai-mcp.mkkhutar2.workers.dev/automation/upload" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -F "video=@dist/daily-youtube-video.mp4;type=video/mp4" \
            -F "thumbnail=@dist/thumbnail.jpg;type=image/jpeg" \
            -F "title=$title" \
            -F "description=$description" \
            -F "tags=$tags"
